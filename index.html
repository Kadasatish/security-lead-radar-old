<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Lead Radar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #ffffff;
    }

    .header {
      padding: 22px 18px;
      background: #111821;
      border-bottom: 1px solid #26313d;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .location {
      margin-top: 6px;
      color: #9ca8b5;
      font-size: 14px;
    }

    .container {
      padding: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #151c25;
      border: 1px solid #26313d;
      border-radius: 14px;
      padding: 18px;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .label {
      color: #9ca8b5;
      font-size: 13px;
    }

    .hot {
      color: #ff4d4d;
    }

    .warm {
      color: #ffc44d;
    }

    .watch {
      color: #b8c2cc;
    }

    .section-title {
      margin: 28px 0 12px;
      font-size: 19px;
    }

    .empty {
      background: #151c25;
      border: 1px dashed #354251;
      border-radius: 14px;
      padding: 30px 18px;
      text-align: center;
      color: #8e9aa7;
    }

    .add-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      border: none;
      border-radius: 50px;
      padding: 16px 22px;
      background: #ffffff;
      color: #000000;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">🛡️ Security Lead Radar</div>
    <div class="location">📍 Kakinada</div>
  </header>

  <main class="container">

    <div class="stats">

      <div class="stat">
        <div class="number hot">0</div>
        <div class="label">🔥 HOT LEADS</div>
      </div>

      <div class="stat">
        <div class="number warm">0</div>
        <div class="label">🟡 WARM LEADS</div>
      </div>

      <div class="stat">
        <div class="number watch">0</div>
        <div class="label">⚪ WATCH</div>
      </div>

      <div class="stat">
        <div class="number">0</div>
        <div class="label">📞 FOLLOW-UPS</div>
      </div>

    </div>

    <div class="section-title">
      Today's Fresh Leads
    </div>

    <div class="empty">
      No leads yet.<br><br>
      The system will show potential security opportunities here.
    </div>

  </main>

  <button class="add-btn">＋ Add Lead</button>

</body>
  </html>
